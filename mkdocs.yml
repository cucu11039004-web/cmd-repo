site_name: 命令速查表
site_description: 遇到就记，按场景查阅，在终端练习。
site_url: https://cucu11039004-web.github.io/cmd-repo/
theme:
  name: material
  language: zh
  font: false
  features:
    - search.highlight
    - content.code.copy
    - navigation.top
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
nav:
  - 首页: index.md
  - 收集箱: inbox.md
  - Linux 文件操作: linux-files.md
  - Linux 进程与网络: linux-process-network.md
  - Git: git.md
  - Docker: docker.md
  - Python 环境: python-env.md
