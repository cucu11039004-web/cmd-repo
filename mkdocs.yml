site_name: 命令速查表
site_description: 遇到就记，按场景查阅，在终端练习。
site_url: https://cucu11039004-web.github.io/cmd-repo/
theme:
  name: material
  language: zh
  font: false
  features:
    - search.highlight
    - content.code.copy
    - navigation.top
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
hooks:
  - scripts/common_commands.py
extra_css:
  - stylesheets/home.css
nav:
  - 首页: index.md
  - Linux: linux.md
  - Git: git.md
  - Python 环境: python-env.md
  - 收集箱: inbox.md
